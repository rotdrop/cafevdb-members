name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - master
      - stable*
  workflow_dispatch:

env:
  APP_NAME: cafevdbmembers
  ORCHESTRA_APP_NAME: cafevdb

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.5']
        server-versions: ['stable35']

    name: php${{ matrix.php-versions }}-nc-${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}
          submodules: true

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: apps/${{ env.APP_NAME }}
          submodules: true

      - name: Checkout orchestra app
        uses: actions/checkout@v4
        with:
          repository: rotdrop/cafevdb
          path: apps/${{ env.ORCHESTRA_APP_NAME }}
          submodules: true

      - name: Install MariaDB server and client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server mariadb-client
          sudo systemctl stop mariadb || true
          sudo systemctl disable mariadb || true
          command -v mariadbd-safe mariadb-install-db mariadb mariadb-dump

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer
          extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, curl, xml, bcmath, gmp
          coverage: none

      - name: Set up Nextcloud
        run: |
          composer install --no-progress
          mkdir -p data
          ./occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass password
          ./occ app:enable --force ${{ env.ORCHESTRA_APP_NAME }} || true

      - name: Install app dependencies
        working-directory: apps/${{ env.APP_NAME }}
        run: make dev-setup-php

      - name: Enable app
        run: ./occ app:enable --force ${{ env.APP_NAME }}

      - name: PHPUnit
        working-directory: apps/${{ env.APP_NAME }}
        run: ./vendor-bin/phpunit/vendor/bin/phpunit -c phpunit.xml --display-all-issues
